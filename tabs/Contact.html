<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
 <style>
    @font-face {
  font-family: 'Comico-Regular';
  src: url('../fonts/Comico-Regular.woff2') format('woff2'),
       url('../fonts/Comico-Regular.woff') format('woff'),
       url('../fonts/Comico-Regular.ttf') format('truetype');
  font-weight: 400;
  font-display: swap;
  font-style: normal;
}
p{
        font-family: 'Comico-Regular', sans-serif;
        margin: 10px 0;

    }
         body /* the body */
     {
        
        background-color: #fdf4e3; /*  background */
        
    }
    .backbuttom
    {
        font-family: 'Comico-Regular', sans-serif;
        font-size: 20px;

        letter-spacing: 0px;
        transition: letter-spacing 0.4s ease-out;
    }
    .backbuttom a:hover{
        letter-spacing: 1px;
    }
    .contactMe{
        font-size: clamp(32px, 5vw, 60px);
        text-align: center;
        margin-top: 30px;
        margin-bottom: 30px;
        padding: 30px 40px;
        text-align: center;
    }
    a {
    text-decoration: none;
    color: inherit; /* Inherits whatever color its parent paragraph has */
    transition: color 0.2s ease;
}

a:hover {
    color: #ed3f27; /* Every link on your page will turn blue on hover */
}
.paper{
    width: 600px;
    padding: 100px;
    background-color: #fcfaf0;
    background-image: linear-gradient(135deg, rgba(0,0,0,0.03) 0%, rgba(255,255,255,0.1) 100%, url('https://media.freestocktextures.com/cache/ba/19/ba1976a777a59906e1fb013e5c72b0ce.jpg'));
    background-repeat: repeat;

    box-shadow:  0 10px 30px rgba(0, 0, 0, 0.05),
    inset 0 0 40px rgba(0, 0, 0, 0.02);
    border: 1px solid rgba(0, 0, 0, 0.06);
  border-radius: 2px;
}

     </style>
<body>

      <p class="contactMe">Contact Me !</p>
      <div class="paper">
        <h1>testing</h1>
        <p>
            email me ! 
        </p>
      </div>
      



      <div class="backbuttom">
        <a href="../index.html" > &lt; Home
        </a>
</div>

</body>

</html>
