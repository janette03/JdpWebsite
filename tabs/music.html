<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    @font-face {
  font-family: 'Comico-Regular';
  src: url('../fonts/Comico-Regular.woff2') format('woff2'),
       url('../fonts/Comico-Regular.woff') format('woff'),
       url('../fonts/Comico-Regular.ttf') format('truetype');
  font-weight: 400;
  font-display: swap;
  font-style: normal;
}

    body /* the body */
     {
        background-color: #fdf4e3; /*  background */
    }
    p{
        font-family: 'Comico-Regular', sans-serif;
        margin: 10px 0;

    }
    .happyFace{
        font-size: 40px;
        text-align: center;
        padding: 50px 50px;
        color: green;
    }
     .backbuttom
    {
        font-family: 'Comico-Regular', sans-serif;
        font-size: 20px;
        align-self: flex-start;
        width: 100%;
        text-align: left;

        letter-spacing: 0px;
        transition: letter-spacing 0.4s ease-out;
        
    }
     .backbuttom a:hover{
        letter-spacing: 1px;
    }
     a {
    text-decoration: none;
    color: inherit; /* Inherits whatever color its parent paragraph has */
    transition: color 0.2s ease;
}
    a:hover {
    color: green; /* Every link will turn blue on hover */
}
</style>
<body>
    <p class="happyFace">♫꒰･‿･๑꒱</p>

    <div class="backbuttom">
        <a href="../index.html" > &lt; Home
        </a>
</div>
</body>
</html>
