<style>
   @font-face {
  font-family: 'Comico-Regular';
  src: url('fonts/Comico-Regular.woff2') format('woff2'),
       url('fonts/Comico-Regular.woff') format('woff'),
       url('fonts/Comico-Regular.ttf') format('truetype');
  font-weight: 400;
  font-display: swap;
  font-style: normal;
}
    body /* the body */
     {
        background-color: #fdf4e3; /*  background */
        display: flex; 
        flex-direction: column; 
        align-items: center; /* Centers horizontally */
        justify-content: center; /* Centers ver */
        width: 100%;
        min-height: 100vh; 
        margin: 0;

    }
    p{
        font-family: 'Comico-Regular', sans-serif;
        margin: 10px 0;

    }
 

.logo {
    font-family: 'Comico-Regular', sans-serif !important;
    font-size: 80px;
    font-weight: bold;
    margin: 0;
    padding: 5px;
    display: flex;
    justify-content: center;
    
}
.JdpText{
     letter-spacing: 0px;
        transition: letter-spacing 0.4s ease-out;
}
 .JdpText:hover{
        letter-spacing: 5px;
    }
     .JdpText :hover {
    color: #feb21a; 
}



    
    .aboutLink a{
        font-family: 'Comico-Regular', sans-serif;
        font-size: 30px;
        font-weight: normal;
        text-align: left;
        text-decoration: none; 
        color: black;

        letter-spacing: 0px;
        transition: letter-spacing 0.4s ease-out;
    }
    .aboutLink a:hover{
        letter-spacing: 2px;
    }
    .aboutLink a:hover {
    color: #feb21a; 
}
.linkStar{
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 20px;
    cursor: pointer;
    width: auto;
}
.star{
    width: 30px;
    aspect-ratio: 1;
    background: #000;
    clip-path: polygon(50% 0,79% 90%,2% 35%,98% 35%,21% 90%); 
    display: inline-block;
    opacity: 0;
    transition: opacity .3s ease-in-out, background-color .3s ease;
}
.linkStar:hover .star{
    opacity: 1;
    background-color: #feb21a;
}

    .projectsLink a {
        font-family: 'Comico-Regular', sans-serif;
        font-size: 30px;
        font-weight: normal;
        text-align: center;
        text-decoration: none; 
        color: black;
        transition: color 0.3s ease; 

        letter-spacing: 0px;
        transition: letter-spacing 0.4s ease-out;

    }
        .projectsLink a:hover {
    color: #134686; 
}
.projectsLink a:hover{
        letter-spacing: 3px;
    }

    .LinkRhombus{
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 20px;
    cursor: pointer;
    width: 100%;
}

.rhombus {
  height: 30px; /* adjust to control the size  */
  aspect-ratio: 1;
  clip-path: polygon(50% 0,100% 50%,50% 100%,0 50%);
  background: #134686;
}


    .contactLink a{
        font-size: 30px;
        font-weight: normal;
        text-align: right;
        text-decoration: none; 
        color: black;
        transition: color 0.3s ease; 

        letter-spacing: 0px;
        transition: letter-spacing 0.4s ease-out;
    }
    .contactLink a:hover{
        letter-spacing: 3px;
    }
    .contactLink a:hover {
    color: #ed3f27; 
}
   .logo-container{
    position: absolute;
    top: 20px;
    left: 20px;
    display: flex;
    gap: 15px;
   }
    .musicEmo a{
    font-size: 30px;
    text-decoration: none; 
        color: black;
        transition: color 0.3s ease; 
        letter-spacing: 0px;
        transition: letter-spacing 0.4s ease-out;
    }
    .musicEmo a:hover{
        letter-spacing: 3px;
    }
   .musicEmo a:hover {
    color: green; 
}
   img{
    width: 40px;
    height: auto;
   
   }

  
   /* Sets both unvisited and visited links to the same color */
a:link, a:visited {
    color: #000; /* Replace with your preferred color */
}

</style>
