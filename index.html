}
.string {
    
    display: inline-flex;
    flex-direction: column;
    height: 1.2em; /* Bound tightly to one line height */
    overflow: hidden; /* Hides the extra text until it rolls up */
    vertical-align: bottom;
    padding: 0 8px;
}



@keyframes move {
    0%, 35% {
        transform: translateY(0); /* Displays Jdp106 */
    }
    50%, 85% {
        transform: translateY(-1.2em); /* Rolls up to display Jdp103 */
    }
    100% {
        transform: translateY(0); /* Returns down smoothly */
    }
}
